# mosquitto.conf — Mosquitto MQTT broker configuration
# Mounted into the container at /mosquitto/config/mosquitto.conf
#
# SECURITY NOTE:
# This config allows anonymous connections for development.
# For production, uncomment the auth lines below and create a password file.
#
# To enable authentication:
#   1. Uncomment the "allow_anonymous false" line
#   2. Uncomment the "password_file" line
#   3. Create password file:
#      docker exec -it buggy-mosquitto mosquitto_passwd -c /mosquitto/config/passwd <username>
#   4. Update MQTT_URL in ingest/.env to include credentials:
#      MQTT_URL=mqtt://username:password@mosquitto:1883
#   5. Restart: docker compose restart mosquitto

# ── Listener: standard MQTT on port 1883 ──────────────────
listener 1883
protocol mqtt

# Allow anonymous connections (development only!)
allow_anonymous true

# For production, uncomment these two lines:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# ── Persistence ────────────────────────────────────────────
# Retained messages (like the geofence command) survive broker restarts.
persistence true
persistence_location /mosquitto/data/

# ── Logging ────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ── Limits ─────────────────────────────────────────────────
max_inflight_messages 200
max_queued_messages 1000
